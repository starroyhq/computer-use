name: Publish verified Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.3.0
        required: true
        type: string
      ci_run_id:
        description: Successful CI run that built all three development packages from the tag commit
        required: true
        type: string
      recovery_run_id:
        description: Original publishing run holding verified-release-assets (only for recovering a partial draft)
        required: false
        type: string
      verify_mirror_upload:
        description: Verify a real large COS upload even when this release is already mirrored
        required: false
        default: false
        type: boolean

concurrency:
  group: official-release-publish
  cancel-in-progress: false
  queue: max

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      reuse: ${{ steps.source.outputs.reuse }}
      tools_sha: ${{ steps.source.outputs.tools_sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Test release artifact preparation
        run: node --test .github/scripts/prepare-release.test.mjs .github/scripts/publish-mirror.test.mjs .github/scripts/cos-upload.test.mjs .github/scripts/cos-multipart-upload.test.mjs .github/scripts/select-release-ci.test.mjs .github/scripts/release-mirror-trigger.test.mjs
      - name: Require a successful CI run for this tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo 'Invalid release tag'; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          version=$(git show "$RELEASE_TAG:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag and package version differ'; exit 1; }
          git cat-file -e "$RELEASE_TAG:.github/release-notes/$RELEASE_TAG.md"
          CI_RUN_ID=$(node .github/scripts/select-release-ci.mjs "$tag_sha" "$CI_RUN_ID")
          {
            echo "ci_run_id=$CI_RUN_ID"
            echo "tools_sha=$(git rev-parse HEAD)"
            echo "sha=$tag_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          state=$(node .github/scripts/verify-release.mjs preflight "$RELEASE_TAG")
          reuse=$(jq -r .reuse <<< "$state")
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  notarize_macos:
    name: Sign and notarize macOS ARM64
    needs: source
    # Explicit recovery must use preserved bytes even when the read-only source token cannot see a draft.
    if: needs.source.outputs.reuse != 'true' && !inputs.recovery_run_id
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CUA_DRIVER_RS_TELEMETRY_ENABLED: 'false'
      CUA_DRIVER_RS_UPDATE_CHECK: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          architecture: arm64
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Sign, notarize, staple and verify
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/notarize-macos-release.sh
      - name: Upload verified notarized package
        uses: actions/upload-artifact@v7
        with:
          name: computer-use-macos-arm64-${{ needs.source.outputs.sha }}-notarized
          path: artifacts/ci/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  publish:
    name: Verify packages and publish
    needs: [source, notarize_macos]
    if: always() && needs.source.result == 'success' && (needs.notarize_macos.result == 'success' || needs.notarize_macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CI_RUN_ID: ${{ needs.source.outputs.ci_run_id }}
      RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      VERSION: ${{ needs.source.outputs.version }}
      VERIFIED_ARTIFACT: verified-release-assets-${{ inputs.tag || github.ref_name }}-${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.tools_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Recheck release state and recover this run's preserved bytes
        id: release_state
        shell: bash
        run: |
          set -euo pipefail
          state=$(node .github/scripts/verify-release.mjs preflight "$RELEASE_TAG")
          echo "reuse=$(jq -r .reuse <<< "$state")" >> "$GITHUB_OUTPUT"
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")
          preserved=$(jq -r --arg name "$VERIFIED_ARTIFACT" 'any(.artifacts[]; .name == $name and .expired == false)' <<< "$artifacts")
          echo "preserved=$preserved" >> "$GITHUB_OUTPUT"
      - name: Reuse this run's artifact if draft creation has not completed
        if: steps.release_state.outputs.reuse != 'true' && steps.release_state.outputs.preserved == 'true'
        run: gh run download "$GITHUB_RUN_ID" --name "$VERIFIED_ARTIFACT" --dir release-assets
      - name: Download Windows development packages
        if: steps.release_state.outputs.reuse != 'true' && steps.release_state.outputs.preserved != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          for platform in windows-arm64 windows-x64; do
            gh run download "$CI_RUN_ID" \
              --name "computer-use-$platform-$SOURCE_SHA" \
              --dir "release-input/$platform"
          done
      - name: Download notarized macOS package
        if: steps.release_state.outputs.reuse != 'true' && steps.release_state.outputs.preserved != 'true'
        uses: actions/download-artifact@v8
        with:
          name: computer-use-macos-arm64-${{ needs.source.outputs.sha }}-notarized
          path: release-input/macos-arm64
      - name: Verify checksums and prepare Release filenames
        if: steps.release_state.outputs.reuse != 'true' && steps.release_state.outputs.preserved != 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          VERSION: ${{ needs.source.outputs.version }}
        run: node .github/scripts/prepare-release.mjs release-input release-assets "$VERSION" "$SOURCE_SHA"
      - name: Preserve the exact verified bytes before creating a draft
        if: steps.release_state.outputs.reuse != 'true' && steps.release_state.outputs.preserved != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.VERIFIED_ARTIFACT }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Reuse existing bytes or recover a partial draft from its original publishing run
        if: steps.release_state.outputs.reuse == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RECOVERY_RUN_ID" && "${{ steps.release_state.outputs.preserved }}" == true && "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            RECOVERY_RUN_ID=$GITHUB_RUN_ID
          fi
          if [[ -n "$RECOVERY_RUN_ID" ]]; then
            [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid recovery run ID'; exit 1; }
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || { echo 'Only a partial draft can use recovery_run_id'; exit 1; }
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID")
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$SOURCE_SHA" \
              '(.event == "workflow_dispatch" or (.event == "push" and .head_sha == $sha)) and .path == ".github/workflows/release.yml" and .head_repository.full_name == $repo' \
              <<< "$run" >/dev/null || { echo 'Recovery artifacts must come from the original official publishing workflow'; exit 1; }
            gh run download "$RECOVERY_RUN_ID" --name "$VERIFIED_ARTIFACT" --dir release-assets
          else
            gh release download "$RELEASE_TAG" --dir release-assets || { echo 'Incomplete draft: rerun with recovery_run_id from the original publishing run. Never rebuild or overwrite its assets.'; exit 1; }
            node .github/scripts/verify-release.mjs release-assets "$RELEASE_TAG"
          fi
      - name: Create draft without replacing an existing release
        if: steps.release_state.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/verify-release.mjs preflight "$RELEASE_TAG" >/dev/null
          git show "$SOURCE_SHA:.github/release-notes/$RELEASE_TAG.md" > release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Computer Use $RELEASE_TAG" --notes-file release-notes.md
      - name: Upload only missing draft assets and verify all GitHub bytes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            node .github/scripts/verify-release.mjs release-assets "$RELEASE_TAG" --allow-partial > missing-assets.json
            while IFS= read -r asset; do
              gh release upload "$RELEASE_TAG" "release-assets/$asset"
            done < <(jq -r '.[]' missing-assets.json)
          fi
          node .github/scripts/verify-release.mjs release-assets "$RELEASE_TAG"
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          node .github/scripts/verify-release.mjs publish "$RELEASE_TAG"

  dispatch_mirror:
    name: Queue the published release mirror
    needs: [source, publish]
    if: always() && needs.source.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ needs.source.outputs.version }}
      VERIFY_UPLOAD: ${{ inputs.verify_mirror_upload && 'true' || 'false' }}
    steps:
      # GITHUB_TOKEN release events do not trigger another workflow. Explicit dispatch does.
      # Do not wait: the mirror needs this workflow's official-release-publish lock.
      - name: Dispatch the exact published tag without waiting
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] || { echo 'Invalid release tag'; exit 1; }
          [[ "$VERIFY_UPLOAD" == true || "$VERIFY_UPLOAD" == false ]] || { echo 'Invalid upload verification flag'; exit 1; }
          gh workflow run mirror-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$RELEASE_TAG" -f "verify_upload=$VERIFY_UPLOAD"
          printf 'Queued Mirror published Release for %s. Follow its separate Actions run for upload and verification.\n' "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
